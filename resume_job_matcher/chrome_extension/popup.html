<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width: 380px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; color: #333; }
    .header { background: #1a1a2e; color: #fff; padding: 12px 16px; }
    .header h1 { font-size: 15px; color: #e94560; }
    .header p { font-size: 11px; color: #aaa; margin-top: 2px; }
    .section { padding: 12px 16px; border-bottom: 1px solid #eee; }
    .section h2 { font-size: 13px; color: #1a1a2e; margin-bottom: 8px; }
    .form-row { margin-bottom: 6px; }
    .form-row label { display: block; font-size: 11px; color: #666; margin-bottom: 2px; }
    .form-row input, .form-row textarea { width: 100%; padding: 6px 8px; border: 1px solid #ddd; border-radius: 4px; font-size: 12px; }
    .form-row input:focus, .form-row textarea:focus { border-color: #e94560; outline: none; }
    .form-row textarea { height: 60px; resize: vertical; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .btn { display: block; width: 100%; padding: 8px; border: none; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; margin-top: 8px; transition: background 0.2s; }
    .btn-fill { background: #e94560; color: #fff; }
    .btn-fill:hover { background: #d63850; }
    .btn-save { background: #28a745; color: #fff; }
    .btn-save:hover { background: #218838; }
    .btn-detect { background: #007bff; color: #fff; }
    .btn-detect:hover { background: #0069d9; }
    .btn-import { background: #6c757d; color: #fff; }
    .btn-import:hover { background: #5a6268; }
    .status { padding: 8px 16px; font-size: 12px; color: #666; text-align: center; }
    .status.success { color: #28a745; }
    .status.error { color: #dc3545; }
    .detected { font-size: 11px; margin-top: 6px; }
    .detected .found { color: #28a745; }
    .detected .missing { color: #999; }
    .tabs { display: flex; border-bottom: 2px solid #eee; }
    .tab { flex: 1; padding: 8px; text-align: center; cursor: pointer; font-size: 12px; font-weight: 500; color: #888; border-bottom: 2px solid transparent; margin-bottom: -2px; }
    .tab.active { color: #e94560; border-bottom-color: #e94560; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    .import-area { margin-top: 6px; }
    .import-area textarea { width: 100%; height: 80px; font-family: monospace; font-size: 11px; }
    .skills-list { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
    .skill-chip { background: #e8f4f8; color: #0c5460; padding: 2px 8px; border-radius: 12px; font-size: 11px; }
  </style>
</head>
<body>
  <div class="header">
    <h1>Job Application Auto-Fill</h1>
    <p>Fill application forms with your profile data</p>
  </div>

  <div class="tabs">
    <div class="tab active" data-tab="fill">Auto-Fill</div>
    <div class="tab" data-tab="profile">Profile</div>
    <div class="tab" data-tab="import">Import</div>
  </div>

  <!-- Auto-Fill Tab -->
  <div id="tab-fill" class="tab-content active">
    <div class="section">
      <button id="btn-fill" class="btn btn-fill">Auto-Fill This Page</button>
      <button id="btn-detect" class="btn btn-detect">Detect Form Fields</button>
      <div id="fill-status" class="status"></div>
      <div id="detected-fields" class="detected"></div>
    </div>
  </div>

  <!-- Profile Tab -->
  <div id="tab-profile" class="tab-content">
    <div class="section">
      <h2>Contact Information</h2>
      <div class="form-row">
        <label>Full Name</label>
        <input type="text" id="full_name" placeholder="John Smith">
      </div>
      <div class="form-grid">
        <div class="form-row">
          <label>Email</label>
          <input type="email" id="email" placeholder="john@example.com">
        </div>
        <div class="form-row">
          <label>Phone</label>
          <input type="tel" id="phone" placeholder="(555) 123-4567">
        </div>
      </div>
      <div class="form-row">
        <label>Address</label>
        <input type="text" id="address" placeholder="123 Main St">
      </div>
      <div class="form-grid">
        <div class="form-row">
          <label>City</label>
          <input type="text" id="city" placeholder="San Francisco">
        </div>
        <div class="form-row">
          <label>State</label>
          <input type="text" id="state" placeholder="CA">
        </div>
      </div>
      <div class="form-grid">
        <div class="form-row">
          <label>Zip Code</label>
          <input type="text" id="zip_code" placeholder="94105">
        </div>
        <div class="form-row">
          <label>LinkedIn</label>
          <input type="url" id="linkedin" placeholder="https://linkedin.com/in/...">
        </div>
      </div>
      <div class="form-row">
        <label>Website / Portfolio</label>
        <input type="url" id="website" placeholder="https://...">
      </div>
      <div class="form-row">
        <label>Summary / About</label>
        <textarea id="summary" placeholder="Brief professional summary..."></textarea>
      </div>
      <button id="btn-save" class="btn btn-save">Save Profile</button>
      <div id="save-status" class="status"></div>

      <div id="skills-section" style="margin-top: 8px;">
        <h2>Skills</h2>
        <div id="skills-list" class="skills-list"></div>
      </div>
    </div>
  </div>

  <!-- Import Tab -->
  <div id="tab-import" class="tab-content">
    <div class="section">
      <h2>Import from Job Matcher</h2>
      <p style="font-size:11px; color:#666; margin-bottom:8px;">
        Enter your Job Matcher server URL to import your profile, or paste JSON directly.
      </p>
      <div class="form-row">
        <label>Server URL</label>
        <input type="text" id="server-url" placeholder="http://localhost:5000" value="http://localhost:5000">
      </div>
      <button id="btn-fetch" class="btn btn-import">Fetch Profile from Server</button>
      <div style="text-align:center; margin: 8px 0; font-size:11px; color:#999;">or</div>
      <div class="import-area">
        <label style="font-size:11px; color:#666;">Paste JSON Profile</label>
        <textarea id="json-import" placeholder='{"contact":{"full_name":"..."},...}'></textarea>
      </div>
      <button id="btn-json-import" class="btn btn-import">Import JSON</button>
      <div id="import-status" class="status"></div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
